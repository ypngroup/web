<header class="sticky top-0 z-50 bg-gray-950 border-b border-gray-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/">
      <img src="{{ .Site.Params.logoSrc }}" alt="{{ .Site.Params.logoAlt }}" class="h-10">
    </a>
    <nav class="flex gap-6">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"
         class="text-sm font-heading font-semibold uppercase tracking-wide transition-colors {{ if eq $.RelPermalink .URL }}text-yellow-400{{ else }}text-gray-300 hover:text-yellow-400{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
    </nav>
  </div>
</header>
