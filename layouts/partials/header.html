<header class="absolute top-0 left-0 right-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="/">
      <img src="/wp-content/uploads/2024/02/ypn-white-1.svg" alt="{{ .Site.Params.logoAlt }}" class="h-6">
    </a>
    <nav class="hidden md:flex gap-6">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"
         class="text-sm font-heading font-normal tracking-wide transition-colors {{ if eq $.RelPermalink .URL }}text-white{{ else }}text-white/70 hover:text-white{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
    </nav>
    <button id="nav-toggle" class="md:hidden text-white p-2 focus:outline-none" aria-label="Åpne meny" aria-expanded="false" aria-controls="mobile-menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden bg-[#001c35]/95 backdrop-blur-sm px-4 pb-4">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}"
       class="block py-3 border-b border-white/10 text-sm font-heading font-normal tracking-wide transition-colors {{ if eq $.RelPermalink .URL }}text-white{{ else }}text-white/70 hover:text-white{{ end }}">
      {{ .Name }}
    </a>
    {{ end }}
  </div>
</header>
<script>
  const navToggle = document.getElementById('nav-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  navToggle.addEventListener('click', function() {
    const expanded = this.getAttribute('aria-expanded') === 'true';
    mobileMenu.classList.toggle('hidden');
    this.setAttribute('aria-expanded', String(!expanded));
  });
  mobileMenu.addEventListener('click', function(e) {
    if (e.target.tagName === 'A') {
      mobileMenu.classList.add('hidden');
      navToggle.setAttribute('aria-expanded', 'false');
    }
  });
</script>
