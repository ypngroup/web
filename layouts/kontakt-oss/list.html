{{ define "main" }}
<div class="bg-gray-950 min-h-screen text-gray-100">

  {{/* Dark hero band for header to float over */}}
  <section class="bg-gray-950 pt-24 pb-12">
    <div class="max-w-2xl mx-auto px-4">
      <h1 class="font-heading font-bold text-4xl uppercase tracking-widest text-white">{{ .Title }}</h1>
      {{ with .Params.intro }}
      <p class="text-gray-400 mt-4">{{ . }}</p>
      {{ end }}
    </div>
  </section>

  {{/* Form */}}
  <div class="max-w-2xl mx-auto px-4 pb-16">
    <form name="kontakt" method="POST" data-netlify="true" class="flex flex-col gap-5">
      <input type="hidden" name="form-name" value="kontakt">

      <div>
        <label for="navn" class="block text-sm font-semibold text-gray-300 mb-1">Navn</label>
        <input type="text" id="navn" name="navn" required
               class="w-full bg-gray-900 border border-gray-700 text-gray-100 px-4 py-2 rounded focus:outline-none focus:border-yellow-400">
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-gray-300 mb-1">E-post</label>
        <input type="email" id="email" name="email" required
               class="w-full bg-gray-900 border border-gray-700 text-gray-100 px-4 py-2 rounded focus:outline-none focus:border-yellow-400">
      </div>

      <div>
        <label for="emne" class="block text-sm font-semibold text-gray-300 mb-1">Emne</label>
        <input type="text" id="emne" name="emne"
               class="w-full bg-gray-900 border border-gray-700 text-gray-100 px-4 py-2 rounded focus:outline-none focus:border-yellow-400">
      </div>

      <div>
        <label for="melding" class="block text-sm font-semibold text-gray-300 mb-1">Melding</label>
        <textarea id="melding" name="melding" rows="6" required
                  class="w-full bg-gray-900 border border-gray-700 text-gray-100 px-4 py-2 rounded focus:outline-none focus:border-yellow-400"></textarea>
      </div>

      <button type="submit"
              class="self-start bg-yellow-400 text-black font-heading font-bold uppercase tracking-wide px-8 py-3 hover:bg-yellow-300 transition-colors rounded">
        Send meldingen
      </button>
    </form>
  </div>

</div>
{{ end }}
