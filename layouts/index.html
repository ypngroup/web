{{ define "main" }}
<section class="flex flex-col items-center justify-center text-center py-24 px-4 bg-gray-950">
  <h1 class="font-heading font-bold text-3xl md:text-5xl text-yellow-400 uppercase tracking-widest mb-4">
    {{ .Params.heroHeading }}
  </h1>
  <p class="text-gray-400 uppercase tracking-widest text-sm md:text-base mb-8">
    {{ .Params.heroSubtext }}
  </p>
  <a href="{{ .Params.heroCtaUrl }}"
     class="bg-yellow-400 text-black font-heading font-bold uppercase tracking-wide px-8 py-3 hover:bg-yellow-300 transition-colors">
    {{ .Params.heroCtaText }}
  </a>
</section>

{{ if .Params.featured }}
<section class="max-w-6xl mx-auto px-4 py-16">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {{ range .Params.featured }}
    <a href="{{ .url }}"
       class="block bg-gray-900 border border-gray-800 hover:border-yellow-400 transition-colors p-6 rounded">
      <h2 class="font-heading font-bold text-yellow-400 uppercase tracking-wide mb-3">{{ .title }}</h2>
      <p class="text-gray-400 text-sm">{{ .description }}</p>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
