{{ define "main" }}
<section class="relative min-h-[45vh] flex items-end bg-brand-navy overflow-hidden">
  <div class="relative z-10 max-w-3xl mx-auto px-4 pb-12 pt-32 w-full">
    <h1 class="font-heading font-semibold text-3xl md:text-5xl leading-tight text-white">{{ .Title }}</h1>
  </div>
</section>

<article class="bg-white text-gray-900">
  <div class="max-w-3xl mx-auto px-4 py-16">
    <div class="[&_h2]:font-heading [&_h2]:font-semibold [&_h2]:text-4xl [&_h2]:leading-tight [&_h2]:mt-10 [&_h2]:mb-4
                [&_h3]:font-heading [&_h3]:font-semibold [&_h3]:text-2xl [&_h3]:mt-8 [&_h3]:mb-3
                [&_p]:leading-relaxed [&_p]:text-gray-800 [&_p]:mb-5
                [&_a]:text-brand-navy [&_a]:underline [&_a]:hover:text-yellow-600
                [&_ul]:list-disc [&_ul]:pl-6 [&_ul]:mb-5 [&_li]:leading-relaxed [&_li]:mb-2
                [&_strong]:font-semibold">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
